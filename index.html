<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoteCloud - Online Notes Sharing</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="front-page">

    <div class="stars">✦</div>
    <div class="float-symbol s1">🤖</div>
    <div class="float-symbol s2">📊</div>
    <div class="float-symbol s3">🗣️</div>
    <div class="float-symbol s4">🌐</div>
    <div class="float-symbol s5">☁️</div>
    <div class="float-symbol s6">📖</div>

    <main class="front-container">

        <div class="cloud-logo">
            <i class="fa-solid fa-cloud"></i>
            <span>+</span>
            <i class="fa-solid fa-book-open"></i>
        </div>

        <p class="front-label">WELCOME TO YOUR KNOWLEDGE CLOUD</p>

        <h1>
            Note<span>Cloud</span>
        </h1>

        <h2>Online Notes Sharing Platform</h2>

        <p class="front-description">
            Store your learning. Discover new ideas.
            Share knowledge with your student community.
        </p>

        <div class="subject-preview">

            <div>
                <span>🤖</span>
                <small>AI</small>
            </div>

            <div>
                <span>📊</span>
                <small>Data Science</small>
            </div>

            <div>
                <span>🗣️</span>
                <small>Text & Speech</small>
            </div>

            <div>
                <span>🌐</span>
                <small>Web Tech</small>
            </div>

        </div>

        <a href="notes.html" class="cloud-button">
            Enter NoteCloud
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <div class="front-stats">
            <span>☁️ 500+ Notes</span>
            <span>👥 150+ Students</span>
            <span>⭐ 4.9 Rating</span>
        </div>

    </main>

</body>
</html>
